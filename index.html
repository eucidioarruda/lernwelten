function taskInput(t){
 if(['choice','order','line'].includes(t.type))return '<div id="special"></div>';
 if(t.type==='place')return '<p>Verändere die Stellenwerte mit + und −. Vergleiche deine Zahl mit der Zielzahl.</p><div class="place-grid" id="places"></div><p class="question number mono" id="built" aria-live="polite">0</p>';
 return (t.type==='balance'?'<label class="small">Meine Vermutung vor dem Wiegen<textarea id="prediction" maxlength="300" placeholder="Ich vermute …, weil …"></textarea></label><div id="balance"></div>':'')+'<form id="answerForm"><div class="answerrow"><label for="answer" class="small">Deine Antwort<br><input id="answer" autocomplete="off" inputmode="numeric" placeholder="Zahl eingeben" required></label></div></form>';
}
function showTask(){attempts=0;hints=0;solved=false;counts=Array(grade===4?4:grade===3?3:2).fill(0);started=Date.now();selectedChoice=null;order=[2,0,3,1];mass=0;const t=list[index];app.innerHTML=`<section class="exercise"><div class="inline-title"><button id="back" class="secondary">← Übersicht</button><span class="badge">${profile} · Klasse ${grade}</span></div><h1>${active==='check'?'Lernstand-Check':findModule(active).title}</h1><div class="inline-title small"><span>Aufgabe ${index+1} von ${list.length}</span><span>In deinem Tempo</span></div><div class="progress" aria-label="Fortschritt"><span style="width:${index/list.length*100}%"></span></div><div class="workbench"><span class="eyebrow">${findModule(t.module).skill}</span><h2 class="question">${t.q}</h2>${t.type==='audio'?'<button id="speak" class="secondary">▶ Zahl anhören</button><p class="small" id="audioStatus" role="status">Die Sprachausgabe verwendet die Stimmen deines Geräts.</p>':''}${taskInput(t)}<div class="actions"><button id="verify">Überprüfen</button><button id="hint" class="secondary">Ich brauche einen Tipp</button></div><p class="feedback" id="feedback" role="status">Probiere es aus. Fehler helfen beim Entdecken.</p><div id="reflection" class="reflection" hidden><label for="reason"><strong>Wie bist du darauf gekommen?</strong></label><p class="small">Erkläre deinen Weg, eine Beobachtung oder eine neue Frage. Du kannst deine Idee auch mündlich mit der Lehrkraft besprechen.</p><textarea id="reason" maxlength="500" placeholder="Ich habe entdeckt … / Mein Weg war … / Ich frage mich …"></textarea></div><button id="next" hidden>Weiter →</button></div></section>`;document.getElementById('back').onclick=home;document.getElementById('verify').onclick=verify;document.getElementById('hint').onclick=()=>{if(solved)return;hints++;document.getElementById('feedback').textContent=t.h;document.getElementById('feedback').className='feedback';};document.getElementById('next').onclick=()=>{const row=logs[logs.length-1];if(row&&row.task===list[index].id){row.reason=document.getElementById('reason').value.trim();persist();}index++;index<list.length?showTask():finish();};if(['choice','order','line'].includes(t.type))drawSpecial();else if(t.type==='place')drawPlaces();else document.getElementById('answerForm').onsubmit=e=>{e.preventDefault();verify();};if(t.type==='balance')drawBalance();if(t.type==='audio')document.getElementById('speak').onclick=()=>{const status=document.getElementById('audioStatus');if(!('speechSynthesis'in window)){status.textContent='Keine Sprachausgabe verfügbar. Eine Lehrkraft liest die Zahl vor: '+t.spoken;return;}speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(t.spoken);utterance.lang='de-DE';utterance.rate=.75;utterance.onerror=()=>{status.textContent='Vorlesen nicht möglich. Eine Lehrkraft liest vor: '+t.spoken;};speechSynthesis.speak(utterance);};}
function drawSpecial(){const t=list[index],el=document.getElementById('special');if(t.type==='choice'){el.innerHTML=t.options.map((o,i)=>`<button class="choice" data-choice="${i}" aria-pressed="${selectedChoice===i}" ${solved?'disabled':''}>${o}</button>`).join('');el.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{selectedChoice=Number(b.dataset.choice);drawSpecial();});}else if(t.type==='order'){el.innerHTML=order.map((v,i)=>`<div class="orderrow"><span>${t.items[v]}</span><button class="secondary" data-pos="${i}" data-dir="-1" aria-label="${t.items[v]} nach oben" ${!i||solved?'disabled':''}>↑</button><button class="secondary" data-pos="${i}" data-dir="1" aria-label="${t.items[v]} nach unten" ${i===3||solved?'disabled':''}>↓</button></div>`).join('');el.querySelectorAll('[data-pos]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.pos),j=i+Number(b.dataset.dir);[order[i],order[j]]=[order[j],order[i]];drawSpecial();});}else{const prior=el.querySelector('#line')?.value||0;el.innerHTML=`<div class="line-labels"><span>0</span><span>${(t.max/2).toLocaleString('de-DE')}</span><span>${t.max.toLocaleString('de-DE')}</span></div><label for="line">Deine Position auf der Zahlengeraden</label><input class="numberline" type="range" id="line" min="0" max="${t.max}" step="${t.step}" value="${prior}" ${solved?'disabled':''}><output id="lineOut">${Number(prior).toLocaleString('de-DE')}</output>`;el.querySelector('#line').oninput=e=>el.querySelector('#lineOut').textContent=Number(e.target.value).toLocaleString('de-DE');}}
function drawBalance(){const t=list[index],diff=Math.sign(mass-t.a);document.getElementById('balance').innerHTML=`<div class="scale"><div class="pan" style="transform:translateY(${-diff*12}px)">Forscherkiste<br><strong>?</strong></div><span aria-hidden="true">⚖</span><div class="pan" style="transform:translateY(${diff*12}px)">Deine Gewichte<br><strong>${mass} g</strong></div></div><p class="scale-status" role="status">${diff===0?'Gleichgewicht!':diff<0?'Die Kiste ist schwerer als deine Gewichte.':'Deine Gewichte sind schwerer als die Kiste.'}</p><div class="actions">${[50,100,500,1000].map(n=>`<button class="secondary" data-mass="${n}">+ ${n} g</button>`).join('')}<button class="secondary" data-mass="-50">− 50 g</button><button class="secondary" data-clear="yes">Waage leeren</button></div>`;document.querySelectorAll('[data-mass]').forEach(b=>b.onclick=()=>{mass=Math.min(5000,Math.max(0,mass+Number(b.dataset.mass)));drawBalance();});document.querySelector('[data-clear]').onclick=()=>{mass=0;drawBalance();};}
function drawPlaces(){const labels=['Tausender','Hunderter','Zehner','Einer'].slice(-counts.length);document.getElementById('places').innerHTML=counts.map((n,i)=>`<div class="place"><strong>${labels[i]}</strong><output aria-label="${labels[i]}">${n}</output><div class="blocks" aria-hidden="true">${'<span class="block"></span>'.repeat(n)}</div><button class="secondary" data-i="${i}" data-d="-1" aria-label="${labels[i]} verringern" ${n===0||solved?'disabled':''}>−</button><button class="secondary" data-i="${i}" data-d="1" aria-label="${labels[i]} erhöhen" ${n===9||solved?'disabled':''}>+</button></div>`).join('');document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{counts[Number(b.dataset.i)]+=Number(b.dataset.d);drawPlaces();});document.getElementById('built').textContent=counts.reduce((s,n)=>s*10+n,0).toLocaleString('de-DE');}
function verify(){if(solved)return;const t=list[index];let value;if(t.type==='choice'){if(selectedChoice===null){document.getElementById('feedback').textContent='Wähle eine begründete Vermutung aus.';return;}value=selectedChoice;}else if(t.type==='order'){value=order.slice();}else if(t.type==='line'){value=Number(document.getElementById('line').value);}else if(t.type==='place')value=counts.reduce((s,n)=>s*10+n,0);else{const raw=document.getElementById('answer').value.trim().replace(/[\s.]/g,'');if(!/^\d+$/.test(raw)){document.getElementById('feedback').textContent='Gib eine ganze Zahl ein, zum Beispiel 2400 oder 2 400.';return;}value=Number(raw);}attempts++;const correct=t.type==='order'?JSON.stringify(value)===JSON.stringify(t.a):value===t.a;logs.push({profile,grade,module:t.module,task:t.id,mode:active==='check'?'check':'practice',answer:value,prediction:document.getElementById('prediction')?.value.trim()||'',correct,attempt:attempts,hints,seconds:Math.round((Date.now()-started)/1000),at:new Date().toISOString()});persist();const f=document.getElementById('feedback');f.className='feedback '+(correct?'good':'retry');f.textContent=correct?'Das passt! '+t.h:'Noch nicht ganz. Prüfe deinen Rechenweg oder nutze einen Tipp.';if(correct){solved=true;document.getElementById('verify').disabled=true;document.getElementById('hint').disabled=true;document.getElementById('next').hidden=false;document.getElementById('reflection').hidden=false;document.getElementById('reason').oninput=()=>{logs[logs.length-1].reason=document.getElementById('reason').value.trim();persist();};if(['choice','order','line'].includes(t.type))drawSpecial();else if(t.type==='place')drawPlaces();else document.getElementById('answer').disabled=true;}}
function finish(){app.innerHTML=`<section class="exercise"><span class="badge">Geschafft!</span><h1>Gut geforscht, ${profile}.</h1><p>Du hast ${list.length} Aufgaben bearbeitet. Schau mit deiner Lehrkraft auf deine Lösungswege: Was war leicht? Wo hat dir ein Tipp geholfen?</p><div class="actions"><button id="again">Werkstätten entdecken</button><button id="results" class="secondary">Ergebnisse ansehen</button></div></section>`;document.getElementById('again').onclick=home;document.getElementById('results').onclick=dashboard;}
function dashboard(){active=null;const selected=logs.filter(x=>x.profile===profile&&x.grade===grade),first=selected.filter(x=>x.attempt===1),solvedIDs=new Set(selected.filter(x=>x.correct).map(x=>x.task));app.innerHTML=`<span class="eyebrow">Beobachten & begleiten</span><h1>Lernen sichtbar machen.</h1><p>Live-Ergebnisse aus dieser Demonstration. Keine vorgefüllten Leistungen und keine echten Schülerdaten.</p>${shell()}<div class="stats"><div class="stat"><span>Aufgaben gelöst</span><strong>${solvedIDs.size} / 18</strong></div><div class="stat"><span>Richtige erste Versuche</span><strong>${first.filter(x=>x.correct).length} / ${first.length}</strong></div><div class="stat"><span>Abgegebene Versuche</span><strong>${selected.length}</strong></div></div><div class="grid">${modules.map(m=>{const rows=selected.filter(x=>x.module===m.id),f=rows.filter(x=>x.attempt===1),success=f.filter(x=>x.correct&&!x.hints).length;return `<article class="card"><h3>${m.skill}</h3><p>${f.length?success+' von '+f.length+' ersten Versuchen richtig und ohne Tipp.':'Noch keine Beobachtung.'}</p><strong>Nächster Gesprächsimpuls</strong><p>${!f.length?'Zuerst eine Aufgabe gemeinsam erproben.':success===f.length?'Eine neue Aufgabe stellen und den Rechenweg erklären lassen.':m.support}</p></article>`;}).join('')}</div><h2>Verlauf · ${profile} · Klasse ${grade}</h2><div class="tablewrap"><table><thead><tr><th>Aufgabe</th><th>Modus</th><th>Antwort</th><th>Ergebnis</th><th>Versuch</th><th>Tipps¹</th><th>Zeit²</th><th>Denkweg / Vermutung</th></tr></thead><tbody id="history"></tbody></table></div><p class="small">¹ Tipps bis zur jeweiligen Abgabe. ² Sekunden seit Aufgabenbeginn. Wiederholte Aufgaben zählen erneut bei den ersten Versuchen. „Aufgaben gelöst“ zählt verschiedene Aufgaben. Tipps ohne anschließende Abgabe werden nicht gespeichert.</p><div class="actions"><button id="export" class="secondary">Diese Ergebnisse als CSV</button><button id="reset" class="secondary">Dieses Demoprofil zurücksetzen</button></div><p class="notice">Demobereich ohne Zugangsschutz. Die Ergebnisse bleiben in diesem Browser und werden nicht zwischen Geräten geteilt. Wenige Aufgaben erlauben keine gesicherte Diagnose. Bitte nur die drei erfundenen Profile verwenden.</p>`;bindFilters(dashboard);const body=document.getElementById('history');selected.slice(-50).reverse().forEach(row=>{const tr=document.createElement('tr');[row.task,row.mode==='check'?'Check':'Übung',row.answer,row.correct?'Richtig':'Erneut probieren',row.attempt,row.hints,row.seconds+' s',[row.prediction,row.reason].filter(Boolean).join(' → ')||'Noch keine Erklärung'].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.appendChild(td);});body.appendChild(tr);});if(!selected.length)body.innerHTML='<tr><td colspan="8">Noch keine Ergebnisse. Starte eine Werkstatt.</td></tr>';document.getElementById('export').onclick=()=>{const fields=['profile','grade','module','task','mode','answer','correct','attempt','hints','seconds','prediction','reason','at'];const csv='\ufeff'+[fields.join(';'),...selected.map(r=>fields.map(k=>'"'+String(r[k]??'').replace(/"/g,'""')+'"').join(';'))].join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='lernwelten-'+profile+'-klasse-'+grade+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};document.getElementById('reset').onclick=()=>{if(confirm('Nur die Demo-Ergebnisse von '+profile+' in Klasse '+grade+' löschen?')){logs=logs.filter(x=>!(x.profile===profile&&x.grade===grade));persist();dashboard();}};}
document.getElementById('homeNav').onclick=home;document.getElementById('teacherNav').onclick=dashboard;home();
</script></body></html>
