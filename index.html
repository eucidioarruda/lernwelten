function shapeSVG(kind,rotation=0,showCorners=false){const points={triangle:[[75,18],[135,119],[15,119]],square:[[30,30],[120,30],[120,120],[30,120]],rectangle:[[12,45],[138,45],[138,105],[12,105]],pentagon:[[75,13],[135,57],[112,128],[38,128],[15,57]],hexagon:[[42.5,18.70835],[107.5,18.70835],[140,75],[107.5,131.29165],[42.5,131.29165],[10,75]]},colors={triangle:'#e9ba4c',square:'#d77a84',rectangle:'#7aa8d7',pentagon:'#9b8fc6',hexagon:'#7cbf9b',circle:'#eba66a'};const p=points[kind];return `<svg class="shape-picture" viewBox="-15 -15 180 180" aria-hidden="true"><g transform="rotate(${rotation} 75 75)">${p?`<polygon points="${p.map(x=>x.join(',')).join(' ')}" fill="${colors[kind]}"/>`:'<circle cx="75" cy="75" r="58" fill="#eba66a"/>'}${showCorners&&p?p.map(([x,y])=>`<circle class="corner" cx="${x}" cy="${y}" r="5"/>`).join(''):''}</g></svg>`;}
function axisSVG(t,isJump){const max=t.max,step=t.step,steps=Math.round(max/step),x=n=>32+n/max*736,position=isJump?jumpPosition:marker;let pieces='';for(let i=0;i<=steps;i++){const n=i*step,labelEvery=t.type==='ruler'?1:Math.max(1,Math.ceil(steps/5)),major=i%labelEvery===0||i===steps;pieces+=`<g class="mark" role="button" tabindex="${solved||isJump?'-1':'0'}" aria-label="${n}${t.type==='ruler'?' Zentimeter':''} markieren" data-mark="${n}"><rect class="target" x="${x(n)-Math.min(17,368/steps)}" y="70" width="${Math.min(34,736/steps)}" height="65" rx="6" fill="transparent"/><line x1="${x(n)}" y1="90" x2="${x(n)}" y2="${major?112:102}" stroke="#243b43" stroke-width="2"/>${major?`<text x="${x(n)}" y="136" text-anchor="${i===steps?'end':i===0?'start':'middle'}">${n.toLocaleString('de-DE')}</text>`:''}</g>`;}let arcs='';if(isJump){let prev=t.start;for(const end of jumpHistory){const a=x(prev),b=x(end);arcs+=`<path class="jump-arc" d="M${a} 82 Q${(a+b)/2} ${Math.max(4,65-Math.abs(b-a)*.15)} ${b} 82"/><circle cx="${b}" cy="82" r="4" fill="#2269b5"/>`;prev=end;}}
 return `<svg class="ruler" viewBox="0 0 800 155" role="group" aria-label="${isJump?'Sprungweg':t.type==='ruler'?'Messleiste in Zentimetern':'Zahlengerade'}"><line x1="32" x2="768" y1="90" y2="90" stroke="#243b43" stroke-width="3"/>${t.type==='ruler'?`<line x1="${x(t.origin)}" x2="${x(t.a)}" y1="48" y2="48" stroke="#c83e43" stroke-width="7" stroke-linecap="round"/><circle cx="${x(t.origin)}" cy="48" r="6" fill="#c83e43"/>`:''}${arcs}${pieces}${position!==null?isJump?`<text class="jump-frog" x="${x(position)}" y="70" text-anchor="middle">🐸</text>`:`<path class="selected" d="M${x(position)-8} 65L${x(position)+8} 65L${x(position)} 83Z"/>`:''}</svg>`;
}

 else{const jumping=t.type==='jump';el.innerHTML=`<div class="ruler-area">${axisSVG(t,jumping)}</div><div class="ruler-meta"><span>${t.type==='ruler'?'Messleiste · cm (keine echte Bildschirmgröße)':'Jeder kleine Strich: '+t.step.toLocaleString('de-DE')}</span><span>${jumping?'Start: '+t.start.toLocaleString('de-DE'):'Tippe auf einen Strich oder nutze die Pfeiltasten.'}</span></div><div class="ruler-controls">${jumping?`${t.jumps.map(n=>`<button data-hop="${n}" ${solved||jumpPosition+n>t.max?'disabled':''}>+ ${n}</button><button data-hop="${-n}" class="secondary" ${solved||jumpPosition-n<0?'disabled':''}>− ${n}</button>`).join('')}<button id="undoJump" class="secondary" ${solved||!jumpHistory.length?'disabled':''}>Letzten Sprung zurück</button>`:`<label for="line">${t.type==='ruler'?'Ende markieren (cm)':'Markierung'}</label><input id="line" class="numberline" type="range" min="0" max="${t.max}" step="${t.step}" value="${marker??0}" ${solved?'disabled':''} aria-label="${t.type==='ruler'?'Ende in Zentimetern markieren':'Zahl markieren'}">`}<output aria-live="polite">${jumping?jumpPosition.toLocaleString('de-DE'):marker===null?'Noch keine Markierung':marker.toLocaleString('de-DE')+(t.type==='ruler'?' cm':'')}</output></div>${jumping?'<p class="small">Dein Weg: '+[t.start,...jumpHistory].map(n=>n.toLocaleString('de-DE')).join(' → ')+'</p>':''}`;

}

function weightSVG(n){const width=Math.round(34+Math.cbrt(n)*3),height=Math.round(40+Math.cbrt(n)*4);return `<svg class="weight-svg" width="${width}" height="${height}" viewBox="0 0 90 105" aria-hidden="true"><path d="M32 23V15Q32 4 45 4Q58 4 58 15V23" fill="none" stroke="#52616e" stroke-width="8"/><path d="M22 23H68L81 91Q81 98 73 98H17Q9 98 9 91Z" fill="#71818b" stroke="#344953" stroke-width="3"/><path d="M25 30H35L25 86H17Z" fill="#ffffff44"/><text x="45" y="63" text-anchor="middle" fill="white" font-size="${n===1000?17:21}" font-weight="800">${n===1000?'1 kg':n+' g'}</text></svg>`;}
function drawBalance(){const t=list[index];mass=placedWeights.reduce((sum,n)=>sum+n,0);const diff=Math.sign(mass-t.a);document.getElementById('balance').innerHTML=`<div class="scale"><div class="pan" style="transform:translateY(${-diff*15}px)"><div class="crate" aria-hidden="true">?</div><strong>Forscherkiste</strong></div><span aria-hidden="true">⚖</span><div class="pan" style="transform:translateY(${diff*15}px)"><div class="weights-on-pan">${placedWeights.length?placedWeights.map((n,i)=>`<button class="weight-remove" data-remove="${i}" aria-label="${n} g von der Waage nehmen" ${solved?'disabled':''}>${weightSVG(n)}</button>`).join(''):'<span class="small">Lege Gewichte auf.</span>'}</div><strong>${mass.toLocaleString('de-DE')} g</strong></div></div><div class="fulcrum" aria-hidden="true"></div><p class="scale-status" role="status">${diff===0?'Gleichgewicht!':diff<0?'Die Kiste ist schwerer als deine Gewichte.':'Deine Gewichte sind schwerer als die Kiste.'}</p><p class="small">Wähle ein Gewicht. Tippe ein aufgelegtes Gewicht an, um es wegzunehmen. Die Bilder sind schematisch; die Beschriftung gibt die Masse an.</p><div class="weight-options">${[50,100,500,1000].map(n=>`<button data-mass="${n}" aria-label="${n} g auflegen" ${solved||mass+n>5000||placedWeights.length>=24?'disabled':''}>${weightSVG(n)}<span>Auflegen</span></button>`).join('')}</div><div class="actions"><button class="secondary" data-clear="yes" ${solved?'disabled':''}>Waage leeren</button></div>`;
 document.querySelectorAll('[data-mass]').forEach(b=>b.onclick=()=>{if(solved)return;placedWeights.push(Number(b.dataset.mass));drawBalance();});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{if(solved)return;placedWeights.splice(Number(b.dataset.remove),1);drawBalance();});document.querySelector('[data-clear]').onclick=()=>{placedWeights=[];drawBalance();};}

function palette(){return '<div class="palette"><span><i style="background:var(--hundred)"></i>Hunderter · rot</span><span><i style="background:var(--ten)"></i>Zehner · blau</span><span><i style="background:var(--unit)"></i>Einer · grün</span></div>';}
function drawPlaces(){
 const labels=['Tausender','Hunderter','Zehner','Einer'].slice(-counts.length),kinds=['thousand','hundred','ten','unit'].slice(-counts.length),colors={thousand:'#27824c',hundred:'#c83e43',ten:'#2269b5',unit:'#27824c'},washes={thousand:'#edf7ec',hundred:'#fceded',ten:'#eaf1fb',unit:'#edf7ec'};
 document.getElementById('places').innerHTML=counts.map((n,i)=>`<div class="place" style="--material:${colors[kinds[i]]};--wash:${washes[kinds[i]]}"><strong>${labels[i]}</strong><output aria-label="${labels[i]}">${n}</output><div><button class="secondary" data-i="${i}" data-d="-1" aria-label="${labels[i]} verringern" ${n===0||solved?'disabled':''}>−</button><button class="secondary" data-i="${i}" data-d="1" aria-label="${labels[i]} erhöhen" ${n===9||solved?'disabled':''}>+</button></div><div class="material-tray" aria-label="${n} ${labels[i]}">${n?`<span class="piece ${kinds[i]}" aria-hidden="true"></span>`.repeat(n):'<span class="material-empty">Noch kein Material</span>'}</div></div>`).join('');
 document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{counts[Number(b.dataset.i)]+=Number(b.dataset.d);drawPlaces();});document.getElementById('built').textContent=counts.reduce((sum,n)=>sum*10+n,0).toLocaleString('de-DE');
}

function verify(){if(solved)return;const t=list[index];let value;if(['choice','inverse','shape','solid'].includes(t.type)){if(selectedChoice===null){document.getElementById('feedback').textContent='Wähle eine begründete Vermutung aus.';return;}value=selectedChoice;}else if(t.type==='order'){value=order.slice();}else if(['line','ruler'].includes(t.type)){if(marker===null){document.getElementById('feedback').textContent='Setze zuerst eine Markierung auf die Leiste.';return;}value=marker;}else if(t.type==='jump'){value=jumpPosition;}else if(t.type==='place')value=counts.reduce((s,n)=>s*10+n,0);else{const raw=document.getElementById('answer').value.trim().replace(/[\s.]/g,'');if(!/^\d+$/.test(raw)){document.getElementById('feedback').textContent='Gib eine ganze Zahl ein, zum Beispiel 2400 oder 2 400.';return;}value=Number(raw);}attempts++;const correct=correctResponse(t,value);logs.push({profile,grade,module:t.module,task:t.id,mode:active==='check'?'check':'practice',answer:value,representation:t.type,path:t.type==='jump'?[t.start,...jumpHistory]:undefined,prediction:document.getElementById('prediction')?.value.trim()||'',correct,attempt:attempts,hints,seconds:Math.round((Date.now()-started)/1000),at:new Date().toISOString()});persist();const f=document.getElementById('feedback');f.className='feedback '+(correct?'good':'retry');f.textContent=correct?'Das passt! '+t.h:'Noch nicht ganz. Prüfe deinen Rechenweg oder nutze einen Tipp.';if(correct){solved=true;document.getElementById('verify').disabled=true;document.getElementById('hint').disabled=true;document.getElementById('next').hidden=false;document.getElementById('reflection').hidden=false;document.getElementById('reason').oninput=()=>{logs[logs.length-1].reason=document.getElementById('reason').value.trim();persist();};if(['choice','order','line','jump','ruler','inverse','shape','solid'].includes(t.type))drawSpecial();else if(t.type==='place')drawPlaces();else {document.getElementById('answer').disabled=true;if(t.type==='balance')drawBalance();}}}
function finish(){app.innerHTML=`<section class="exercise"><span class="badge">Geschafft!</span><h1>Gut geforscht, ${profile}.</h1><p>Du hast ${list.length} Aufgaben bearbeitet. Schau mit deiner Lehrkraft auf deine Lösungswege: Was war leicht? Wo hat dir ein Tipp geholfen?</p><div class="actions"><button id="again">Werkstätten entdecken</button><button id="results" class="secondary">Ergebnisse ansehen</button></div></section>`;document.getElementById('again').onclick=home;document.getElementById('results').onclick=dashboard;}
function dashboard(){active=null;const selected=logs.filter(x=>x.profile===profile&&x.grade===grade&&(!x.classGroup||(x.classGroup===grade+classLetter&&x.schoolYear===schoolYear))),first=selected.filter(x=>x.attempt===1&&!x.review),solvedIDs=new Set(selected.filter(x=>(x.correct||x.review)&&modules.some(m=>bank[grade][m.id].some(t=>t.id===x.task))).map(x=>x.task));app.innerHTML=`<span class="eyebrow">Beobachten & begleiten</span><h1>Lernen sichtbar machen.</h1><p>Live-Ergebnisse aus dieser Demonstration. Keine vorgefüllten Leistungen und keine echten Schülerdaten.</p>${shell()}<div class="stats"><div class="stat"><span>Aufgaben abgeschlossen</span><strong>${solvedIDs.size} / ${totalTasks()}</strong></div><div class="stat"><span>Richtige erste Versuche</span><strong>${first.filter(x=>x.correct).length} / ${first.length}</strong></div><div class="stat"><span>Abgegebene Versuche</span><strong>${selected.length}</strong></div></div><div class="grid">${modules.map(m=>{const rows=selected.filter(x=>x.module===m.id),f=rows.filter(x=>x.attempt===1&&!x.review),success=f.filter(x=>x.correct&&!x.hints).length;return `<article class="card"><h3>${m.skill}</h3><p>${f.length?success+' von '+f.length+' ersten Versuchen richtig und ohne Tipp.':'Noch keine Beobachtung.'}</p><strong>Nächster Gesprächsimpuls</strong><p>${!f.length?'Zuerst eine Aufgabe gemeinsam erproben.':success===f.length?'Eine neue Aufgabe stellen und den Rechenweg erklären lassen.':m.support}</p></article>`;}).join('')}</div><h2>Verlauf · ${profile} · Klasse ${grade}</h2><div class="tablewrap"><table><thead><tr><th>Aufgabe</th><th>Modus</th><th>Antwort</th><th>Ergebnis</th><th>Versuch</th><th>Tipps¹</th><th>Zeit²</th><th>Denkweg / Vermutung</th></tr></thead><tbody id="history"></tbody></table></div><p class="small">¹ Tipps bis zur jeweiligen Abgabe. ² Sekunden seit Aufgabenbeginn. Wiederholte Aufgaben zählen erneut bei den ersten Versuchen. „Aufgaben abgeschlossen“ zählt verschiedene Aufgaben. Tipps ohne anschließende Abgabe werden nicht gespeichert.</p><div class="actions"><button id="export" class="secondary">Diese Ergebnisse als CSV</button><button id="reset" class="secondary">Dieses Demoprofil zurücksetzen</button></div><p class="notice">Demobereich ohne Zugangsschutz. Die Ergebnisse bleiben in diesem Browser und werden nicht zwischen Geräten geteilt. Wenige Aufgaben erlauben keine gesicherte Diagnose. Bitte nur die drei erfundenen Profile verwenden.</p>`;bindFilters(dashboard);const body=document.getElementById('history');selected.slice(-50).reverse().forEach(row=>{const tr=document.createElement('tr');[row.task,row.mode==='open'?'Forschermodell':row.mode==='check'?'Check':'Übung',row.answer,row.review?'Gespräch offen':row.correct?'Richtig':'Erneut probieren',row.attempt,row.hints,row.seconds+' s',[row.classGroup?'Lerngruppe: '+row.classGroup+' '+(row.schoolYear||''):'',row.evidence?'Textbeleg: Abschnitt '+row.evidence:'',row.prediction,Array.isArray(row.path)?'Sprungweg: '+row.path.join(' → '):'',row.reason].filter(Boolean).join(' → ')||'Noch keine Erklärung'].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.appendChild(td);});body.appendChild(tr);});if(!selected.length)body.innerHTML='<tr><td colspan="8">Noch keine Ergebnisse. Starte eine Werkstatt.</td></tr>';document.getElementById('export').onclick=()=>{const fields=['profile','grade','classGroup','schoolYear','review','evidence','module','task','mode','answer','correct','attempt','hints','seconds','prediction','path','reason','at'];const csv='\ufeff'+[fields.join(';'),...selected.map(r=>fields.map(k=>'"'+String(r[k]??'').replace(/"/g,'""')+'"').join(';'))].join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='lernwelten-'+profile+'-klasse-'+grade+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};document.getElementById('reset').onclick=()=>{if(confirm('Nur die Demo-Ergebnisse von '+profile+' in Klasse '+grade+' löschen?')){logs=logs.filter(x=>!(x.profile===profile&&x.grade===grade));persist();dashboard();}};}

</script><script src="activities.js?v=4"></script><script src="space.js?v=4"></script><script>home();</script></body></html>
